<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="google-site-verification" content="7uBMpQdMikUwnbO_WabTQvwaZ6aXgKW0TBJFwNi6K54" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Caça-Palavras</title>
  <style>
    /* === STREAMING_CHUNK:Configuring CSS Variables and Reset === */
    /* Define as variáveis de cores e configurações globais (tema do jogo) */
    :root {
      --primary-color: #7c2d12;
      --primary-light: #9a3412;
      --accent-color: #d97706;
      --bg-color: #fef3c7;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --found-color: #16a34a;
      --line-color: rgba(22, 163, 74, 0.4);
      --drag-color: rgba(217, 119, 6, 0.4);
      --border-radius: 12px;
      --error-color: #dc2626;
    }

    /* Reset global de margens e padding para garantir consistência visual em todos os navegadores */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    /* === STREAMING_CHUNK:Styling Body and Header === */
    /* Estilização do corpo da página, centralizando o conteúdo */
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      padding: 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    header h1 {
      color: var(--primary-color);
      font-size: 2rem;
      margin-bottom: 0.25rem;
    }

    header p {
      color: #64748b;
      font-size: 1rem;
    }

    main {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: center;
    }

    .hidden {
      display: none !important;
    }

    /* === STREAMING_CHUNK:Styling Setup Screen Form === */
    /* Estilos do cartão de configuração (onde o usuário insere as palavras e título do jogo) */
    .setup-card {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: var(--border-radius);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 700px;
    }

    .setup-card h2 {
      color: var(--primary-color);
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .setup-card > p {
      text-align: center;
      color: #64748b;
      margin-bottom: 1.5rem;
    }

    .error-msg {
      background-color: #fee2e2;
      color: var(--error-color);
      padding: 0.75rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      text-align: center;
      font-weight: 600;
      border: 1px solid #f87171;
    }

    .setup-form-group {
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .setup-form-group label {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--primary-color);
    }

    .setup-form-group input,
    .setup-form-group select {
      padding: 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 1rem;
      transition: all 0.2s;
      background-color: white;
    }

    .setup-form-group input:focus,
    .setup-form-group select:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.2);
    }

    .setup-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    /* === STREAMING_CHUNK:Styling Game Layout and Canvas === */
    /* Layout principal do jogo (quadro do lado esquerdo, painel lateral do lado direito) */
    .game-layout {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 1.5rem;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
    }

    .game-board-container {
      background: var(--card-bg);
      padding: 1rem;
      border-radius: var(--border-radius);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      position: relative;
      user-select: none;
      touch-action: none;
    }

    .canvas-wrapper {
      position: relative;
      width: 500px;
      height: 500px;
      max-width: 85vw;
      max-height: 85vw;
    }

    .canvas-wrapper canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 8px;
    }

    #grid-canvas { z-index: 10; }
    #lines-canvas { z-index: 20; pointer-events: none; }
    #drag-canvas { z-index: 30; pointer-events: none; }

    /* === STREAMING_CHUNK:Styling Sidebar, Status and Buttons === */
    /* Estilos da barra lateral que contém o cronômetro, controles e a lista de palavras */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 320px;
      max-width: 100%;
    }

    .card {
      background: var(--card-bg);
      padding: 1.25rem;
      border-radius: var(--border-radius);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .status-panel {
      display: flex;
      justify-content: center; /* Centered since score is removed */
      align-items: center;
      margin-bottom: 1rem;
    }

    .status-item {
      text-align: center;
    }

    .status-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #64748b;
      font-weight: 600;
    }

    .status-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--primary-color);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .btn-row {
      display: flex;
      gap: 0.5rem;
    }

    button {
      flex: 1;
      padding: 0.75rem 1rem;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.95rem;
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--primary-light);
    }

    .btn-secondary {
      background-color: var(--accent-color);
      color: white;
    }

    .btn-secondary:hover {
      filter: brightness(0.9);
    }
    
    .btn-outline {
      background-color: transparent;
      border: 2px solid var(--primary-color);
      color: var(--primary-color);
    }
    
    .btn-outline:hover {
      background-color: #fffbeb;
    }

    /* Classe utilitária para preencher 100% da largura do contêiner */
    .w-full {
      width: 100%;
    }

    /* === STREAMING_CHUNK:Styling Word List Card === */
    /* Estilos da lista visual de palavras que precisam ser encontradas */
    .word-list-card h2 {
      font-size: 1.1rem;
      margin-bottom: 0.75rem;
      color: var(--primary-color);
      border-bottom: 2px solid var(--bg-color);
      padding-bottom: 0.5rem;
    }

    .word-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
      list-style: none;
    }

    .word-item {
      font-size: 0.95rem;
      font-weight: 600;
      color: #475569;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      transition: all 0.3s ease;
    }

    .word-item.found {
      color: var(--found-color);
      text-decoration: line-through;
      background-color: #dcfce7;
    }

    /* === STREAMING_CHUNK:Styling Modal Dialog === */
    /* Estilos da janela modal (tela de vitória) que aparece ao final do jogo */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 2rem;
      border-radius: var(--border-radius);
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .modal-content h2 {
      color: var(--primary-color);
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
    }

    .modal-content p {
      margin-bottom: 1.5rem;
      color: #475569;
    }

    footer {
      margin-top: auto;
      padding: 1.5rem 0 0.5rem 0;
      text-align: center;
      font-size: 0.85rem;
      color: #78350f;
    }

    /* === STREAMING_CHUNK:Styling Responsive Media Queries === */
    /* Ajustes de layout para adaptação a telas menores (smartphones e tablets) */
    @media (max-width: 768px) {
      .setup-grid {
        grid-template-columns: 1fr;
      }
      
      .game-layout {
        flex-direction: column;
        align-items: center;
      }
      
      .sidebar {
        width: 100%;
        max-width: 500px;
      }
      
      .sidebar > div:first-child { order: 2; }
      .sidebar > .word-list-card { order: 1; }
    }

    /* === STREAMING_CHUNK:Styling Print Media Rules === */
    /* Regras específicas que entram em ação quando o usuário tenta imprimir a página */
    @media print {
      body, html { background: transparent !important; color: #000 !important; }
      .game-board-container, .card, .setup-card, .modal { background: transparent !important; box-shadow: none !important; border: none !important; }
      .status-panel, .actions, .modal, button, #setup-screen { display: none !important; }
      .game-layout { flex-direction: column !important; align-items: center !important; display: flex !important; }
      .game-board-container { margin-bottom: 2rem !important; }
      .sidebar { width: 100% !important; max-width: 100% !important; display: block !important; }
      .word-list { grid-template-columns: repeat(4, 1fr) !important; gap: 0.5rem !important; text-align: center; }
      header h1, header p, footer p, .word-item { color: #000 !important; }
      .word-list-card h2 { border-bottom: 1px solid #000 !important; }
      .print-hidden { display: none !important; }
      .word-item.found { background-color: transparent !important; color: #000 !important; }
    }
  </style>
</head>
<body>

  <!-- === STREAMING_CHUNK:Rendering Header === -->
  <!-- Cabeçalho principal da página -->
  <header>
    <h1 id="header-title">Gerador de Caça-Palavras</h1>
    <p id="header-desc">Crie seu jogo personalizado e divirta-se!</p>
  </header>

  <main>
    <!-- === STREAMING_CHUNK:Rendering Setup Form Screen === -->
    <!-- Tela de configuração inicial para preenchimento de palavras -->
    <section id="setup-screen" class="setup-card">
      <h2>Criar Novo Jogo</h2>
      <p>Preencha os campos abaixo para gerar seu próprio caça-palavras.</p>

      <!-- Mensagem de erro que aparece caso o usuário digite poucas palavras -->
      <div id="setup-error" class="error-msg hidden">
        Insira pelo menos 3 palavras para gerar o jogo.
      </div>

      <div class="setup-form-group">
        <label for="game-title">Título Principal</label>
        <input type="text" id="game-title" placeholder="Ex: Virtudes e valores humanos" maxlength="40">
      </div>

      <div class="setup-form-group">
        <label for="game-subtitle">Subtítulo ou Dica</label>
        <input type="text" id="game-subtitle" placeholder="Ex: Encontre as palavras escondidas" maxlength="60">
      </div>

      <!-- Nova opção para escolher o tamanho do quadro -->
      <div class="setup-form-group">
        <label for="grid-size">Tamanho do Quadro:</label>
        <select id="grid-size">
          <option value="10">10x10 (Fácil)</option>
          <option value="15" selected>15x15 (Médio)</option>
          <option value="18">20x20 (Difícil)</option>
        </select>
      </div>

      <div class="setup-form-group">
        <label>Palavras</label>
        <div class="setup-grid">
          <!-- Campos de entrada para as palavras do jogo pré-preenchidos, com maxlength ajustado para 18 -->
          <input type="text" id="word-1" placeholder="Palavra 1" maxlength="18" value="Bondade">
          <input type="text" id="word-2" placeholder="Palavra 2" maxlength="18" value="Fidelidade">
          <input type="text" id="word-3" placeholder="Palavra 3" maxlength="18" value="Amor">
          <input type="text" id="word-4" placeholder="Palavra 4" maxlength="18" value="Alegria">
          <input type="text" id="word-5" placeholder="Palavra 5" maxlength="18" value="Respeito">
          <input type="text" id="word-6" placeholder="Palavra 6" maxlength="18" value="Sabedoria">
          <input type="text" id="word-7" placeholder="Palavra 7" maxlength="18" value="Coragem">
          <input type="text" id="word-8" placeholder="Palavra 8" maxlength="18" value="Pureza">
          <input type="text" id="word-9" placeholder="Palavra 9" maxlength="18" value="Esperança">
          <input type="text" id="word-10" placeholder="Palavra 10" maxlength="18" value="Humildade">
        </div>
      </div>

      <!-- Botão para gerar a grade do jogo -->
      <button id="btn-generate" class="btn-primary w-full">Gerar Caça-Palavras</button>
    </section>

    <!-- === STREAMING_CHUNK:Rendering Active Game Screen === -->
    <!-- Contêiner principal do jogo ativo, escondido inicialmente -->
    <div id="game-screen" class="game-layout hidden">
      <!-- Área dos painéis de desenho (Canvas) para as letras e interação -->
      <section class="game-board-container">
        <div class="canvas-wrapper">
          <canvas id="grid-canvas"></canvas>
          <canvas id="lines-canvas"></canvas>
          <canvas id="drag-canvas"></canvas>
        </div>
      </section>

      <!-- Barra lateral de status, controles de jogo e a lista de palavras a achar -->
      <aside class="sidebar">
        <div class="card">
          <div class="status-panel">
            <div class="status-item">
              <div class="status-label">Tempo</div>
              <div class="status-value" id="timer">00:00</div>
            </div>
            
          </div>

          <div class="actions">
            <div class="btn-row">
              <button id="btn-hint" class="btn-secondary">Revelar</button>
              <button id="btn-restart" class="btn-primary">Embaralhar</button>
            </div>
            <div class="btn-row">
              <button id="btn-print" class="btn-outline">Imprimir</button>
              <button id="btn-edit" class="btn-outline">Editar</button>
            </div>
          </div>
        </div>

        <div class="card word-list-card">
          <!-- Adicionada classe .print-hidden para esconder os números durante a impressão -->
          <h2>Encontrar <span class="print-hidden">(<span id="found-count">0</span>/<span id="total-count">0</span>)</span></h2>
          <!-- Elemento lista que é populado via JavaScript dinamicamente -->
          <ul class="word-list" id="word-list-ui"></ul>
        </div>
      </aside>
    </div>
  </main>

  <footer>
    <!-- Este texto será substituído pelo JavaScript com o link atual do site -->
    <p id="footer-watermark"></p>
  </footer>

  <!-- === STREAMING_CHUNK:Rendering Win Modal Dialog === -->
  <!-- Pop-up modal de Vitória (sobrepõe a tela ao achar todas as palavras) -->
  <div class="modal" id="win-modal">
    <div class="modal-content">
      <h2>Parabéns! 🎉</h2>
      <p>Você encontrou todas as palavras!</p>
      
      <div class="actions" style="gap: 0.5rem;">
        <button class="btn-primary w-full" id="btn-print-answers">Imprimir Respostas</button>
        <div class="btn-row">
          <button class="btn-secondary" id="btn-play-again">Jogar Novamente</button>
          <button class="btn-outline" id="btn-new-game-modal">Novo Jogo</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // === STREAMING_CHUNK:Initializing Constants and Sanitizer ===

    // Função que limpa as palavras: retira acentos, números, e transforma tudo em letra maiúscula
    function sanitizeWord(word) {
      return word
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-zA-Z]/g, "")
        .toUpperCase();
    }

    // === STREAMING_CHUNK:Defining Timer Manager (Score Removed) ===
    // Classe responsável por gerenciar e formatar a contagem de tempo
    class TimerManager {
      constructor(onTick) {
        this.seconds = 0; // Conta total de segundos
        this.timerId = null; // Identificador da execução do relógio
        this.onTick = onTick; // Ação executada a cada 1 segundo (atualiza o relógio na tela)
      }

      start() {
        this.reset();
        this.timerId = setInterval(() => {
          this.seconds++;
          this.onTick(this.formatTime(this.seconds));
        }, 1000);
      }

      stop() {
        if (this.timerId) clearInterval(this.timerId);
      }

      reset() {
        this.stop();
        this.seconds = 0;
        this.onTick(this.formatTime(0));
      }

      formatTime(sec) {
        const m = Math.floor(sec / 60).toString().padStart(2, '0');
        const s = (sec % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      }
    }

    // === STREAMING_CHUNK:Defining Word Search Game Engine ===
    // Classe principal que gerencia o jogo de Caça-Palavras
    class WordSearchGame {
      constructor() {
        this.gridSize = 14; // Agora esse valor será atualizado com a escolha do usuário
        this.customWords = []; // Guarda as palavras inseridas
        this.words = []; // Palavras sendo usadas na rodada
        this.grid = []; // Estrutura 2D da matriz de letras
        this.placedWords = []; // Histórico das posições onde as palavras foram encaixadas
        this.foundWords = new Set(); // Conjunto para armazenar palavras já encontradas

        // Pegando as referências do HTML pros painéis de desenho
        this.gridCanvas = document.getElementById('grid-canvas'); // Para as Letras
        this.linesCanvas = document.getElementById('lines-canvas'); // Para as linhas verdes (encontradas)
        this.dragCanvas = document.getElementById('drag-canvas'); // Para a linha laranja (seleção arrastada)

        // Contextos 2D pra desenhar em cada painel
        this.ctxGrid = this.gridCanvas.getContext('2d');
        this.ctxLines = this.linesCanvas.getContext('2d');
        this.ctxDrag = this.dragCanvas.getContext('2d');

        this.isDragging = false;
        this.startCell = null;
        this.currentCell = null;

        this.timerMgr = new TimerManager(
          (timeStr) => document.getElementById('timer').textContent = timeStr
        );

        this.setupEventListeners();
      }

      // Função que inicia o processamento do jogo e exibe na tela, recebendo também o tamanho do grid
      start(wordsList, size) {
        this.gridSize = size;
        this.customWords = wordsList;
        this.init();
      }

      // Prepara os status do zero para uma nova partida ou re-embaralhamento
      init() {
        document.getElementById('win-modal').classList.remove('active');
        this.words = [...this.customWords];
        this.foundWords.clear(); // Limpa estado de achadas
        this.generateMatrix(); // Gera o grid e encaixa palavras
        this.renderUIList(); // Renderiza a lista de palavras lateral
        
        // Timeout pequeno pra garantir que as divs montaram antes de calcular o tamanho da tela do jogo
        setTimeout(() => {
          this.resizeCanvases();
        }, 50);
        
        this.timerMgr.start(); // Dispara o tempo
      }

      // Motor principal que encaixa as palavras na matriz e preenche com letras avulsas
      generateMatrix() {
        // Inicializando um grid vazio
        this.grid = Array(this.gridSize).fill(null).map(() => Array(this.gridSize).fill(''));
        this.placedWords = [];

        // Direções possíveis para o caça-palavras
        const directions = [
          [0, 1],   // Leste
          [1, 0],   // Sul
          [-1, -1], // Noroeste
          [1, -1]   // Sudoeste
        ];

        // Organizar palavras das maiores pras menores para encaixar mais facilmente
        const sortedWords = [...this.words].sort((a, b) => b.clean.length - a.clean.length);

        for (let wordObj of sortedWords) {
          const word = wordObj.clean;
          let placed = false;
          let attempts = 0;

          // Tenta encaixar a palavra na grade em posições aleatórias até 300 vezes
          while (!placed && attempts < 300) {
            attempts++;
            const dir = directions[Math.floor(Math.random() * directions.length)];
            const startRow = Math.floor(Math.random() * this.gridSize);
            const startCol = Math.floor(Math.random() * this.gridSize);

            // Verifica se as posições calculadas estão vazias ou têm uma letra compatível
            if (this.canPlaceWord(word, startRow, startCol, dir)) {
              const cells = [];
              for (let i = 0; i < word.length; i++) {
                const r = startRow + dir[0] * i;
                const c = startCol + dir[1] * i;
                this.grid[r][c] = word[i];
                cells.push({ r, c });
              }
              // Salva o rastreio da palavra para a checagem do mouse depois
              this.placedWords.push({
                ...wordObj,
                id: `word_${this.placedWords.length}`, // ID único gerado
                cells,
                start: cells[0],
                end: cells[cells.length - 1]
              });
              placed = true;
            }
          }
        }

        // Preenche o restante dos espaços vazios com letras aleatórias
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        for (let r = 0; r < this.gridSize; r++) {
          for (let c = 0; c < this.gridSize; c++) {
            if (!this.grid[r][c]) {
              this.grid[r][c] = alphabet[Math.floor(Math.random() * alphabet.length)];
            }
          }
        }
      }

      // Verifica se a palavra cabe sem vazar o grid e sem sobrescrever letras incorretas
      canPlaceWord(word, r, c, dir) {
        for (let i = 0; i < word.length; i++) {
          const nr = r + dir[0] * i;
          const nc = c + dir[1] * i;

          if (nr < 0 || nr >= this.gridSize || nc < 0 || nc >= this.gridSize) return false;
          if (this.grid[nr][nc] !== '' && this.grid[nr][nc] !== word[i]) return false;
        }
        return true;
      }

      // Função que redesenha tudo de forma adaptável baseado no tamanho do navegador (responsividade)
      resizeCanvases() {
        const wrapper = this.gridCanvas.parentElement;
        const rect = wrapper.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;

        [this.gridCanvas, this.linesCanvas, this.dragCanvas].forEach(canvas => {
          canvas.width = rect.width * dpr;
          canvas.height = rect.height * dpr;
          const ctx = canvas.getContext('2d');
          ctx.scale(dpr, dpr);
        });

        this.cellSize = rect.width / this.gridSize;
        this.drawGrid();
        this.redrawFoundLines();
      }

      // Ajuda pra limpar os painéis
      clearCanvas(ctx) {
        ctx.clearRect(0, 0, this.gridCanvas.width, this.gridCanvas.height);
      }

      // Escreve as letras das matrizes no Canvas do jogo principal
      drawGrid() {
        this.clearCanvas(this.ctxGrid);
        this.ctxGrid.textAlign = 'center';
        this.ctxGrid.textBaseline = 'middle';
        this.ctxGrid.font = `600 ${this.cellSize * 0.5}px system-ui, sans-serif`;
        this.ctxGrid.fillStyle = '#1e293b';

        for (let r = 0; r < this.gridSize; r++) {
          for (let c = 0; c < this.gridSize; c++) {
            const x = c * this.cellSize + this.cellSize / 2;
            const y = r * this.cellSize + this.cellSize / 2;
            this.ctxGrid.fillText(this.grid[r][c], x, y);
          }
        }
      }

      // Função utilitária que desenha as linhas que atravessam as palavras
      drawLine(ctx, start, end, color) {
        const x1 = start.c * this.cellSize + this.cellSize / 2;
        const y1 = start.r * this.cellSize + this.cellSize / 2;
        const x2 = end.c * this.cellSize + this.cellSize / 2;
        const y2 = end.r * this.cellSize + this.cellSize / 2;

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = color;
        ctx.lineWidth = this.cellSize * 0.7;
        ctx.lineCap = 'round';
        ctx.stroke();
      }

      // Atualiza na tela as linhas verdes das palavras que o usuário já conseguiu acertar
      redrawFoundLines() {
        this.clearCanvas(this.ctxLines);
        this.placedWords.forEach(pw => {
          if (this.foundWords.has(pw.id)) {
            this.drawLine(this.ctxLines, pw.start, pw.end, 'rgba(22, 163, 74, 0.35)');
          }
        });
      }

      // Atribui todos os comandos visuais do mouse, toque de celular e botões aos elementos HTML
      setupEventListeners() {
        window.addEventListener('resize', () => {
           if (!document.getElementById('game-screen').classList.contains('hidden')) {
               this.resizeCanvases();
           }
        });

        const wrapper = this.gridCanvas.parentElement;

        // Identifica clique inicial / Início do touch
        wrapper.addEventListener('pointerdown', (e) => {
          this.isDragging = true;
          this.startCell = this.getCellFromEvent(e);
          this.currentCell = this.startCell;
        });

        // Evento enquanto o usuário arrasta o dedo ou segura o clique no mouse
        wrapper.addEventListener('pointermove', (e) => {
          if (!this.isDragging) return;
          const newCell = this.getCellFromEvent(e);
          if (!this.currentCell || newCell.r !== this.currentCell.r || newCell.c !== this.currentCell.c) {
            this.currentCell = this.alignCell(this.startCell, newCell);
            this.clearCanvas(this.ctxDrag);
            if (this.currentCell) {
              this.drawLine(this.ctxDrag, this.startCell, this.currentCell, 'rgba(217, 119, 6, 0.4)');
            }
          }
        });

        // Quando o usuário solta o clique / retira o dedo
        window.addEventListener('pointerup', () => {
          if (!this.isDragging) return;
          this.isDragging = false;
          this.clearCanvas(this.ctxDrag);
          if (this.startCell && this.currentCell) {
            this.checkSelection(this.startCell, this.currentCell); // Analisa a seleção final do usuário
          }
          this.startCell = null;
          this.currentCell = null;
        });

        // Mapeia eventos para os cliques dos botões de controle
        document.getElementById('btn-restart').addEventListener('click', () => this.init());
        document.getElementById('btn-hint').addEventListener('click', () => this.giveHint());
        document.getElementById('btn-play-again').addEventListener('click', () => this.init());
        
        const triggerPrint = () => window.print();
        document.getElementById('btn-print').addEventListener('click', triggerPrint);
        document.getElementById('btn-print-answers').addEventListener('click', triggerPrint);
      }

      // Calcula a exata célula clicada baseada nos eixos X/Y e margem
      getCellFromEvent(e) {
        const rect = this.gridCanvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const c = Math.floor(Math.max(0, Math.min(x, rect.width - 1)) / this.cellSize);
        const r = Math.floor(Math.max(0, Math.min(y, rect.height - 1)) / this.cellSize);
        return { r, c };
      }

      // Corrige a seleção para ser apenas perfeitamente na horizontal, vertical ou diagonal
      alignCell(start, current) {
        const dr = current.r - start.r;
        const dc = current.c - start.c;

        if (dr === 0 || dc === 0 || Math.abs(dr) === Math.abs(dc)) {
          return current;
        }

        const maxDist = Math.max(Math.abs(dr), Math.abs(dc));
        const stepR = dr === 0 ? 0 : Math.round(dr / maxDist);
        const stepC = dc === 0 ? 0 : Math.round(dc / maxDist);

        return {
          r: Math.max(0, Math.min(this.gridSize - 1, start.r + stepR * maxDist)),
          c: Math.max(0, Math.min(this.gridSize - 1, start.c + stepC * maxDist))
        };
      }

      // Valida se as duas pontas da seleção equivalem a alguma palavra verdadeira do quadro
      checkSelection(start, end) {
        const found = this.placedWords.find(pw => {
          if (this.foundWords.has(pw.id)) return false; // Impede encontrar duas vezes
          
          // Confere de trás pra frente e de frente pra trás
          const matchNormal = (pw.start.r === start.r && pw.start.c === start.c && pw.end.r === end.r && pw.end.c === end.c);
          const matchReverse = (pw.start.r === end.r && pw.start.c === end.c && pw.end.r === start.r && pw.end.c === start.c);
          return matchNormal || matchReverse;
        });

        if (found) {
          // Quando achada: Salva a ID da palavra e atualiza o jogo
          this.foundWords.add(found.id);
          this.redrawFoundLines();
          this.updateUIList();

          // Verifica se o usuário completou tudo
          if (this.foundWords.size === this.placedWords.length) {
            this.timerMgr.stop();
            document.getElementById('win-modal').classList.add('active'); // Abre popup final
          }
        }
      }

      // Ação do Botão revelar, descobre magicamente 1 palavra que falta
      giveHint() {
        const uncollected = this.placedWords.filter(pw => !this.foundWords.has(pw.id));
        if (uncollected.length === 0) return;

        const target = uncollected[Math.floor(Math.random() * uncollected.length)];
        this.foundWords.add(target.id);
        this.redrawFoundLines();
        this.updateUIList();

        // Checa se, com a dica, a pessoa venceu
        if (this.foundWords.size === this.placedWords.length) {
          this.timerMgr.stop();
          document.getElementById('win-modal').classList.add('active');
        }
      }

      // Monta as linhas `<li>` para listar todas as palavras de procuradas na barra lateral
      renderUIList() {
        const container = document.getElementById('word-list-ui');
        container.innerHTML = '';
        document.getElementById('total-count').textContent = this.placedWords.length;
        document.getElementById('found-count').textContent = 0;

        this.placedWords.forEach(w => {
          const li = document.createElement('li');
          li.className = 'word-item';
          li.id = `ui-${w.id}`; // Uses unique ID 
          li.textContent = w.display;
          container.appendChild(li);
        });
      }

      // Aplica o estilo visual de texto riscado às palavras que o jogador achou
      updateUIList() {
        document.getElementById('found-count').textContent = this.foundWords.size;
        this.foundWords.forEach(id => {
          const el = document.getElementById(`ui-${id}`);
          if (el) el.classList.add('found');
        });
      }
    }

    // === STREAMING_CHUNK:Initializing Application and Screen Switching ===
    let game = null;

    // Aguarda o HTML principal ser montado na tela para liberar a configuração inicial
    document.addEventListener('DOMContentLoaded', () => {
      // Cria a marca d'água no rodapé usando a URL em que a página está aberta
      const watermark = document.getElementById('footer-watermark');
      if (watermark) {
        watermark.textContent = "Gerado em: " + window.location.href;
      }

      const btnGenerate = document.getElementById('btn-generate');
      const btnEdit = document.getElementById('btn-edit');
      const btnNewGameModal = document.getElementById('btn-new-game-modal');
      const errorMsg = document.getElementById('setup-error');
      
      const setupScreen = document.getElementById('setup-screen');
      const gameScreen = document.getElementById('game-screen');
      const winModal = document.getElementById('win-modal');

      // Restaura o visual inicial para o usuário digitar mais palavras (Editar ou Novo Jogo)
      function showSetup() {
        if(game) game.timerMgr.stop();
        gameScreen.classList.add('hidden');
        winModal.classList.remove('active');
        setupScreen.classList.remove('hidden');
      }

      btnEdit.addEventListener('click', showSetup);
      btnNewGameModal.addEventListener('click', showSetup);

      // Clicou para Gerar o Caça-Palavras
      btnGenerate.addEventListener('click', () => {
        errorMsg.classList.add('hidden');
        const customWordsList = [];

        // Coleta e filtra texto dos 10 campos de palavras
        for (let i = 1; i <= 10; i++) {
          const inputVal = document.getElementById(`word-${i}`).value.trim();
          if (inputVal.length > 0) {
            customWordsList.push({
              display: inputVal.toUpperCase(),
              clean: sanitizeWord(inputVal)
            });
          }
        }

        // Impede a geração se não houver palavras suficientes inseridas pelo usuário
        if (customWordsList.length < 3) {
          errorMsg.textContent = "Por favor, preencha pelo menos 3 palavras para gerar o jogo.";
          errorMsg.classList.remove('hidden');
          return;
        }

        // Pega valores preenchidos ou usa textos padrão genéricos
        const titleVal = document.getElementById('game-title').value.trim() || "Meu Caça-Palavras";
        const descVal = document.getElementById('game-subtitle').value.trim() || "Encontre as palavras escondidas!";
        const selectedSize = parseInt(document.getElementById('grid-size').value, 10);
        
        document.getElementById('header-title').textContent = titleVal;
        document.getElementById('header-desc').textContent = descVal;

        // Oculta tela de form. Exibe jogo.
        setupScreen.classList.add('hidden');
        gameScreen.classList.remove('hidden');

        // Cria e reseta o jogo
        if (!game) {
          game = new WordSearchGame();
        }
        game.start(customWordsList, selectedSize); // Passa o tamanho selecionado pro jogo
      });
    });
  </script>
