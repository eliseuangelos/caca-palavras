<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="google-site-verification" content="7uBMpQdMikUwnbO_WabTQvwaZ6aXgKW0TBJFwNi6K54" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Caça-Palavras</title>
  
  <!-- Biblioteca para geração do PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --primary-color: #7c2d12;
      --primary-light: #9a3412;
      --accent-color: #d97706;
      --bg-color: #fef3c7;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --found-color: #16a34a;
      --line-color: rgba(22, 163, 74, 0.4);
      --drag-color: rgba(217, 119, 6, 0.4);
      --border-radius: 12px;
      --error-color: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      padding: 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    header h1 {
      color: var(--primary-color);
      font-size: 2rem;
      margin-bottom: 0.25rem;
    }
    header p {
      color: #64748b;
      font-size: 1rem;
    }

    main {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: center;
    }

    .hidden {
      display: none !important;
    }

    .setup-card {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: var(--border-radius);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 700px;
    }
    .setup-card h2 {
      color: var(--primary-color);
      margin-bottom: 0.5rem;
      text-align: center;
    }
    .setup-card > p {
      text-align: center;
      color: #64748b;
      margin-bottom: 1.5rem;
    }

    .mode-switcher {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .mode-btn {
      flex: 1;
      min-width: 200px;
      padding: 0.85rem 1rem;
      border: 2px solid #cbd5e1;
      background: white;
      color: #64748b;
      border-radius: var(--border-radius);
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .mode-btn:hover { background: #f8fafc; }
    .mode-btn.active {
      border-color: var(--primary-color);
      background: var(--bg-color);
      color: var(--primary-color);
    }

    .error-msg {
      background-color: #fee2e2;
      color: var(--error-color);
      padding: 0.75rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      text-align: center;
      font-weight: 600;
      border: 1px solid #f87171;
    }
    .setup-form-group {
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .setup-form-group label {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--primary-color);
    }
    .setup-form-group input,
    .setup-form-group select {
      padding: 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 1rem;
      background-color: white;
      transition: all 0.2s;
    }
    .setup-form-group input:focus,
    .setup-form-group select:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.2);
    }
    .setup-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .mb-6 { margin-bottom: 1.5rem; }

    .game-layout {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 1.5rem;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
    }
    .game-board-container {
      background: var(--card-bg);
      padding: 1rem;
      border-radius: var(--border-radius);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      position: relative;
      user-select: none;
      touch-action: none;
    }
    .canvas-wrapper {
      position: relative;
      width: 500px;
      height: 500px;
      max-width: 85vw;
      max-height: 85vw;
    }
    .canvas-wrapper canvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      border-radius: 8px;
    }
    #lines-canvas { z-index: 10; pointer-events: none; }
    #grid-canvas { z-index: 20; pointer-events: none; }
    #drag-canvas { z-index: 30; pointer-events: none; }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 320px;
      max-width: 100%;
    }
    .card {
      background: var(--card-bg);
      padding: 1.25rem;
      border-radius: var(--border-radius);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .status-panel {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 1rem;
    }
    .status-item { text-align: center; }
    .status-label { font-size: 0.75rem; text-transform: uppercase; color: #64748b; font-weight: 600; }
    .status-value { font-size: 1.75rem; font-weight: 700; color: var(--primary-color); }

    .actions { display: flex; flex-direction: column; gap: 0.5rem; }
    .btn-row { display: flex; gap: 0.5rem; }
    button {
      flex: 1; padding: 0.75rem 1rem; border: none;
      border-radius: 6px; font-weight: 600; cursor: pointer;
      transition: all 0.2s ease; font-size: 0.95rem;
    }
    .btn-primary { background-color: var(--primary-color); color: white; }
    .btn-primary:hover { background-color: var(--primary-light); }
    .btn-secondary { background-color: var(--accent-color); color: white; }
    .btn-secondary:hover { filter: brightness(0.9); }
    .btn-outline { background-color: transparent; border: 2px solid var(--primary-color); color: var(--primary-color); }
    .btn-outline:hover { background-color: #fffbeb; }
    .w-full { width: 100%; }

    .word-list-card h2 {
      font-size: 1.1rem; margin-bottom: 0.75rem; color: var(--primary-color);
      border-bottom: 2px solid var(--bg-color); padding-bottom: 0.5rem;
    }
    .word-list {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; list-style: none;
    }
    .word-item {
      font-size: 0.95rem; font-weight: 600; color: #475569;
      padding: 0.25rem 0.5rem; border-radius: 4px; transition: all 0.3s ease;
    }
    .word-item.found {
      color: var(--found-color); text-decoration: line-through; background-color: #dcfce7;
    }

    .modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6); align-items: center; justify-content: center;
      z-index: 1000; padding: 1rem;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: white; padding: 2rem; border-radius: var(--border-radius);
      text-align: center; max-width: 400px; width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }
    .modal-content h2 { color: var(--primary-color); font-size: 1.75rem; margin-bottom: 0.5rem; }
    .modal-content p { margin-bottom: 1.5rem; color: #475569; }

    footer { margin-top: auto; padding: 1.5rem 0 0.5rem 0; text-align: center; font-size: 0.85rem; color: #78350f; font-weight: 500; }

    /* Responsividade */
    @media (max-width: 768px) {
      .setup-grid { grid-template-columns: 1fr; }
      .game-layout { flex-direction: column; align-items: center; }
      .sidebar { width: 100%; max-width: 500px; }
      .sidebar > div:first-child { order: 2; }
      .sidebar > .word-list-card { order: 1; }
    }

    @media print {
      @page { margin: 1cm; }
      body, html { background: transparent !important; color: #000 !important; }
      .game-board-container, .card, .setup-card, .modal { background: transparent !important; box-shadow: none !important; border: none !important; }
      .status-panel, .actions, .modal, button, #setup-screen, .mode-switcher { display: none !important; }
      
      .game-layout { flex-direction: column !important; align-items: center !important; display: flex !important; }
      .game-board-container { margin-bottom: 2rem !important; }
      .sidebar { width: 100% !important; max-width: 100% !important; display: block !important; }
      
      .word-list { grid-template-columns: repeat(4, 1fr) !important; gap: 0.5rem !important; text-align: center; }
      header h1, header p, footer p, .word-item { color: #000 !important; }
      .word-list-card h2 { border-bottom: 1px solid #000 !important; }
      .print-hidden { display: none !important; }
      
      /* Tratamento Específico para Impressão Normal */
      body.print-normal #lines-canvas { display: none !important; }
      body.print-normal .word-item { text-decoration: none !important; background-color: transparent !important; color: #000 !important; }
      
      /* Tratamento Específico para Impressão Gabarito */
      body.print-answer #lines-canvas { display: block !important; }
      body.print-answer .word-item { background-color: transparent !important; color: #000 !important; }
    }
  </style>
</head>
<body>

  <header>
    <h1 id="header-title">Gerador de Caça-Palavras</h1>
    <p id="header-desc">Preencha os campos abaixo para gerar seu próprio caça-palavras. Ou utilize o "Gerador Automático por Tema".</p>
  </header>

  <main>
    <section id="setup-screen" class="setup-card">
      <div class="mode-switcher">
        <button id="btn-mode-manual" class="mode-btn active" aria-label="Ativar Gerador Manual">✏️ Gerador Manual</button>
        <button id="btn-mode-auto" class="mode-btn" aria-label="Ativar Gerador Automático">🎲 Gerador Automático</button>
      </div>

      <div id="setup-error" class="error-msg hidden"></div>

      <div id="title-fields">
        <div class="setup-form-group">
          <label for="game-title">Título Principal</label>
          <input type="text" id="game-title" placeholder="Ex: Meu Caça-Palavras" maxlength="40">
        </div>
        <div class="setup-form-group">
          <label for="game-subtitle">Subtítulo ou Dica</label>
          <input type="text" id="game-subtitle" placeholder="Ex: Encontre as palavras escondidas" maxlength="60">
        </div>
      </div>
      
      <div class="setup-form-group mb-6">
        <label for="grid-size">Tamanho do Quadro</label>
        <select id="grid-size">
          <option value="10">10x10 (Pequeno - Palavras até 10 letras)</option>
          <option value="15" selected>15x15 (Médio - Palavras até 15 letras)</option>
          <option value="20">20x20 (Grande - Palavras até 20 letras)</option>
        </select>
      </div>

      <div id="auto-fields" class="hidden">
        <div class="setup-grid mb-6">
          <div class="setup-form-group">
            <label for="auto-theme">Tema</label>
            <select id="auto-theme">
              <option value="">Selecione um tema</option>
            </select>
          </div>
          <div class="setup-form-group">
            <label for="auto-quantity">Quantidade de palavras</label>
            <select id="auto-quantity"></select>
          </div>
        </div>
      </div>

      <div id="manual-fields">
        <div class="setup-form-group mb-6">
          <label>Palavras (Insira no mínimo 3 palavras)</label>
          <div class="setup-grid">
            <input type="text" id="word-1" placeholder="Palavra 1" maxlength="20">
            <input type="text" id="word-2" placeholder="Palavra 2" maxlength="20">
            <input type="text" id="word-3" placeholder="Palavra 3" maxlength="20">
            <input type="text" id="word-4" placeholder="Palavra 4" maxlength="20">
            <input type="text" id="word-5" placeholder="Palavra 5" maxlength="20">
            <input type="text" id="word-6" placeholder="Palavra 6" maxlength="20">
            <input type="text" id="word-7" placeholder="Palavra 7" maxlength="20">
            <input type="text" id="word-8" placeholder="Palavra 8" maxlength="20">
            <input type="text" id="word-9" placeholder="Palavra 9" maxlength="20">
            <input type="text" id="word-10" placeholder="Palavra 10" maxlength="20">
          </div>
        </div>
      </div>

      <button id="btn-generate" class="btn-primary w-full">Gerar Caça-Palavras</button>
    </section>

    <div id="game-screen" class="game-layout hidden">
      <section class="game-board-container" aria-label="Área do Caça-Palavras">
        <div class="canvas-wrapper">
          <canvas id="grid-canvas"></canvas>
          <canvas id="lines-canvas"></canvas>
          <canvas id="drag-canvas"></canvas>
        </div>
      </section>

      <aside class="sidebar">
        <div class="card">
          <div class="status-panel">
            <div class="status-item">
              <div class="status-label">Tempo</div>
              <div class="status-value" id="timer" aria-live="polite">00:00</div>
            </div>
          </div>
          <div class="actions">
            <div class="btn-row">
              <button id="btn-hint" class="btn-secondary">Revelar Palavra</button>
              <button id="btn-restart" class="btn-primary">Embaralhar</button>
            </div>
            <div class="btn-row">
              <button id="btn-print" class="btn-outline">Imprimir</button>
              <button id="btn-print-answers-inline" class="btn-outline">Imprimir Gabarito</button>
            </div>
            <div class="btn-row">
              <button id="btn-pdf" class="btn-outline">Salvar PDF</button>
            </div>
            <button id="btn-edit" class="btn-outline w-full" style="margin-top: 0.5rem;">Editar Jogo</button>
          </div>
        </div>

        <div class="card word-list-card">
          <h2>Encontrar <span class="print-hidden">(<span id="found-count">0</span>/<span id="total-count">0</span>)</span></h2>
          <ul class="word-list" id="word-list-ui" aria-label="Lista de Palavras a Encontrar"></ul>
        </div>
      </aside>
    </div>
  </main>

  <footer>
    <p id="footer-watermark"></p>
  </footer>

  <!-- Modal de Vitória -->
  <div class="modal" id="win-modal" aria-hidden="true">
    <div class="modal-content">
      <h2>Parabéns! 🎉</h2>
      <p>Você encontrou todas as palavras!</p>
      <div class="actions" style="gap: 0.5rem;">
        <button class="btn-primary w-full" id="btn-print-answers">Imprimir Gabarito</button>
        <button class="btn-secondary w-full" id="btn-pdf-answers">Salvar PDF (Gabarito)</button>
        <div class="btn-row">
          <button class="btn-outline" id="btn-play-again">Embaralhar Novo</button>
          <button class="btn-outline" id="btn-new-game-modal">Criar Novo</button>
        </div>
      </div>
    </div>
  </div>

    class TimerManager {
      constructor(onTick) {
        this.seconds = 0;
        this.timerId = null;
        this.onTick = onTick;
      }
      start() {
        this.reset();
        this.timerId = setInterval(() => {
          this.seconds++;
          this.onTick(this.formatTime(this.seconds));
        }, 1000);
      }
      stop() {
        if (this.timerId) clearInterval(this.timerId);
      }
      reset() {
        this.stop();
        this.seconds = 0;
        this.onTick(this.formatTime(0));
      }
      formatTime(sec) {
        const m = Math.floor(sec / 60).toString().padStart(2, '0');
        const s = (sec % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      }
    }

    const DIRECTIONS = [
      [-1, -1], [-1, 0], [-1, 1], // Noroeste, Norte, Nordeste
      [0, -1],           [0, 1],  // Oeste, Leste
      [1, -1],  [1, 0],  [1, 1]   // Sudoeste, Sul, Sudeste
    ];

    class WordSearchGame {
      constructor() {
        this.gridSize = 15;
        this.words = [];
        this.grid = [];
        this.placedWords = [];
        this.foundWords = new Set();
        
        this.gridCanvas = document.getElementById('grid-canvas');
        this.linesCanvas = document.getElementById('lines-canvas');
        this.dragCanvas = document.getElementById('drag-canvas');
        this.ctxGrid = this.gridCanvas.getContext('2d');
        this.ctxLines = this.linesCanvas.getContext('2d');
        this.ctxDrag = this.dragCanvas.getContext('2d');
        
        this.isDragging = false;
        this.startCell = null;
        this.currentCell = null;
        this.cellSize = 0;

        this.timerMgr = new TimerManager(
          timeStr => document.getElementById('timer').textContent = timeStr
        );

        this.setupEventListeners();
      }

      start(wordsList, size) {
        this.gridSize = size;
        this.words = wordsList;
        this.init();
      }

      init() {
        document.getElementById('win-modal').classList.remove('active');
        this.foundWords.clear();
        
        try {
          this.generateMatrixWithRetry();
        } catch (error) {
          throw error;
        }
        
        UI.renderWordList(this.placedWords);
        setTimeout(() => this.resizeCanvases(), 50);
        this.timerMgr.start();
      }

      generateMatrixWithRetry() {
        const maxRetries = 100;
        for (let i = 0; i < maxRetries; i++) {
          if (this.tryGenerateMatrix()) return true;
        }
        throw new Error("Não foi possível posicionar todas as palavras nesta matriz. Tente aumentar o tamanho do quadro ou reduzir a quantidade de palavras.");
      }

      tryGenerateMatrix() {
        this.grid = Array(this.gridSize).fill(null).map(() => Array(this.gridSize).fill(''));
        this.placedWords = [];
        
        const sortedWords = [...this.words].sort((a, b) => b.clean.length - a.clean.length);

        for (let wordObj of sortedWords) {
          const word = wordObj.clean;
          let placed = false;
          let attempts = 0;

          while (!placed && attempts < 200) {
            attempts++;
            const dir = DIRECTIONS[Math.floor(Math.random() * DIRECTIONS.length)];
            const startRow = Math.floor(Math.random() * this.gridSize);
            const startCol = Math.floor(Math.random() * this.gridSize);

            if (this.canPlaceWord(word, startRow, startCol, dir)) {
              const cells = [];
              for (let i = 0; i < word.length; i++) {
                const r = startRow + dir[0] * i;
                const c = startCol + dir[1] * i;
                this.grid[r][c] = word[i];
                cells.push({ r, c });
              }
              this.placedWords.push({
                ...wordObj,
                id: `word_${this.placedWords.length}`,
                cells,
                start: cells[0],
                end: cells[cells.length - 1]
              });
              placed = true;
            }
          }
          if (!placed) return false; 
        }

        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        for (let r = 0; r < this.gridSize; r++) {
          for (let c = 0; c < this.gridSize; c++) {
            if (!this.grid[r][c]) {
              this.grid[r][c] = alphabet[Math.floor(Math.random() * alphabet.length)];
            }
          }
        }
        return true;
      }

      canPlaceWord(word, r, c, dir) {
        for (let i = 0; i < word.length; i++) {
          const nr = r + dir[0] * i;
          const nc = c + dir[1] * i;
          if (nr < 0 || nr >= this.gridSize || nc < 0 || nc >= this.gridSize) return false;
          if (this.grid[nr][nc] !== '' && this.grid[nr][nc] !== word[i]) return false;
        }
        return true;
      }

      resizeCanvases() {
        const wrapper = this.gridCanvas.parentElement;
        const rect = wrapper.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;

        [this.gridCanvas, this.linesCanvas, this.dragCanvas].forEach(canvas => {
          canvas.width = rect.width * dpr;
          canvas.height = rect.height * dpr;
          const ctx = canvas.getContext('2d');
          ctx.scale(dpr, dpr);
        });

        this.cellSize = rect.width / this.gridSize;
        this.drawGrid();
        this.redrawFoundLines();
      }

      drawGrid() {
        this.ctxGrid.clearRect(0, 0, this.gridCanvas.width, this.gridCanvas.height);
        this.ctxGrid.textAlign = 'center';
        this.ctxGrid.textBaseline = 'middle';
        this.ctxGrid.font = `600 ${this.cellSize * 0.55}px system-ui, sans-serif`;
        this.ctxGrid.fillStyle = '#1e293b';

        for (let r = 0; r < this.gridSize; r++) {
          for (let c = 0; c < this.gridSize; c++) {
            const x = c * this.cellSize + this.cellSize / 2;
            const y = r * this.cellSize + this.cellSize / 2;
            this.ctxGrid.fillText(this.grid[r][c], x, y);
          }
        }
      }

      drawLine(ctx, start, end, color) {
        const x1 = start.c * this.cellSize + this.cellSize / 2;
        const y1 = start.r * this.cellSize + this.cellSize / 2;
        const x2 = end.c * this.cellSize + this.cellSize / 2;
        const y2 = end.r * this.cellSize + this.cellSize / 2;

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = color;
        ctx.lineWidth = this.cellSize * 0.7;
        ctx.lineCap = 'round';
        ctx.stroke();
      }

      redrawFoundLines() {
        this.ctxLines.clearRect(0, 0, this.linesCanvas.width, this.linesCanvas.height);
        this.placedWords.forEach(pw => {
          if (this.foundWords.has(pw.id)) {
            this.drawLine(this.ctxLines, pw.start, pw.end, 'rgba(34, 197, 94, 0.5)');
          }
        });
      }

      drawAllAnswers() {
        this.ctxLines.clearRect(0, 0, this.linesCanvas.width, this.linesCanvas.height);
        this.placedWords.forEach(pw => {
          this.drawLine(this.ctxLines, pw.start, pw.end, 'rgba(34, 197, 94, 0.5)');
        });
      }

      setupEventListeners() {
        window.addEventListener('resize', () => {
           if (!document.getElementById('game-screen').classList.contains('hidden')) {
               this.resizeCanvases();
           }
        });

        const wrapper = this.gridCanvas.parentElement;

        wrapper.addEventListener('pointerdown', (e) => {
          if(document.body.classList.contains('print-answer') || document.body.classList.contains('print-normal')) return;
          this.isDragging = true;
          this.startCell = this.getCellFromEvent(e);
          this.currentCell = this.startCell;
        });

        wrapper.addEventListener('pointermove', (e) => {
          if (!this.isDragging) return;
          const newCell = this.getCellFromEvent(e);
          if (!this.currentCell || newCell.r !== this.currentCell.r || newCell.c !== this.currentCell.c) {
            this.currentCell = this.alignCellTo8Directions(this.startCell, newCell);
            this.ctxDrag.clearRect(0, 0, this.dragCanvas.width, this.dragCanvas.height);
            if (this.currentCell) {
              this.drawLine(this.ctxDrag, this.startCell, this.currentCell, 'rgba(217, 119, 6, 0.4)');
            }
          }
        });

        window.addEventListener('pointerup', () => {
          if (!this.isDragging) return;
          this.isDragging = false;
          this.ctxDrag.clearRect(0, 0, this.dragCanvas.width, this.dragCanvas.height);
          if (this.startCell && this.currentCell) {
            this.checkSelection(this.startCell, this.currentCell);
          }
          this.startCell = null;
          this.currentCell = null;
        });
      }

      getCellFromEvent(e) {
        const rect = this.gridCanvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const c = Math.floor(Math.max(0, Math.min(x, rect.width - 1)) / this.cellSize);
        const r = Math.floor(Math.max(0, Math.min(y, rect.height - 1)) / this.cellSize);
        return { r, c };
      }

      alignCellTo8Directions(start, current) {
        const dr = current.r - start.r;
        const dc = current.c - start.c;
        if (dr === 0 && dc === 0) return current;

        const angle = Math.atan2(dr, dc);
        const snapAngle = Math.round(angle / (Math.PI / 4)) * (Math.PI / 4);
        const stepR = Math.round(Math.sin(snapAngle));
        const stepC = Math.round(Math.cos(snapAngle));
        const maxDist = Math.max(Math.abs(dr), Math.abs(dc));

        return {
          r: Math.max(0, Math.min(this.gridSize - 1, start.r + stepR * maxDist)),
          c: Math.max(0, Math.min(this.gridSize - 1, start.c + stepC * maxDist))
        };
      }

      checkSelection(start, end) {
        const found = this.placedWords.find(pw => {
          if (this.foundWords.has(pw.id)) return false;
          const matchNormal = (pw.start.r === start.r && pw.start.c === start.c && pw.end.r === end.r && pw.end.c === end.c);
          const matchReverse = (pw.start.r === end.r && pw.start.c === end.c && pw.end.r === start.r && pw.end.c === start.c);
          return matchNormal || matchReverse;
        });

        if (found) {
          this.foundWords.add(found.id);
          this.redrawFoundLines();
          UI.updateWordFound(found.id, this.foundWords.size, this.placedWords.length);

          if (this.foundWords.size === this.placedWords.length) {
            this.timerMgr.stop();
            document.getElementById('win-modal').classList.add('active');
          }
        }
      }

      giveHint() {
        const uncollected = this.placedWords.filter(pw => !this.foundWords.has(pw.id));
        if (uncollected.length === 0) return;

        const target = uncollected[Math.floor(Math.random() * uncollected.length)];
        this.foundWords.add(target.id);
        this.redrawFoundLines();
        UI.updateWordFound(target.id, this.foundWords.size, this.placedWords.length);

        if (this.foundWords.size === this.placedWords.length) {
          this.timerMgr.stop();
          document.getElementById('win-modal').classList.add('active');
        }
      }
    }

    const UI = {
      showError(msg) {
        const el = document.getElementById('setup-error');
        el.textContent = msg;
        el.classList.remove('hidden');
      },
      hideError() {
        document.getElementById('setup-error').classList.add('hidden');
      },
      renderWordList(placedWords) {
        const container = document.getElementById('word-list-ui');
        container.innerHTML = '';
        document.getElementById('total-count').textContent = placedWords.length;
        document.getElementById('found-count').textContent = 0;

        placedWords.forEach(w => {
          const li = document.createElement('li');
          li.className = 'word-item';
          li.id = `ui-${w.id}`;
          li.textContent = w.display;
          container.appendChild(li);
        });
      },
      updateWordFound(id, foundCount, totalCount) {
        document.getElementById('found-count').textContent = foundCount;
        const el = document.getElementById(`ui-${id}`);
        if (el) el.classList.add('found');
      },
      sanitizeWord(word) {
        return word.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z]/g, "").toUpperCase();
      },
      shuffleArray(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
          randomIndex = Math.floor(Math.random() * currentIndex);
          currentIndex--;
          [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
      }
    };

    let gameInstance = null;
    let currentMode = 'manual';

    document.addEventListener('DOMContentLoaded', () => {
      
      const selectTheme = document.getElementById('auto-theme');
      Object.entries(THEMES).forEach(([key, theme]) => {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = theme.name;
        selectTheme.appendChild(opt);
      });

      const btnManual = document.getElementById('btn-mode-manual');
      const btnAuto = document.getElementById('btn-mode-auto');
      const manualFields = document.getElementById('manual-fields');
      const autoFields = document.getElementById('auto-fields');
      const titleFields = document.getElementById('title-fields');

      btnManual.addEventListener('click', () => {
        currentMode = 'manual';
        btnManual.classList.add('active');
        btnAuto.classList.remove('active');
        manualFields.classList.remove('hidden');
        autoFields.classList.add('hidden');
        titleFields.classList.remove('hidden');
        UI.hideError();
      });

      btnAuto.addEventListener('click', () => {
        currentMode = 'auto';
        btnAuto.classList.add('active');
        btnManual.classList.remove('active');
        autoFields.classList.remove('hidden');
        manualFields.classList.add('hidden');
        titleFields.classList.add('hidden');
        updateQuantityOptions();
        UI.hideError();
      });

      const selectGridSize = document.getElementById('grid-size');
      const selectQuantity = document.getElementById('auto-quantity');

      function updateQuantityOptions() {
        const size = selectGridSize.value;
        const ranges = {
          "10": { min: 3, max: 7 },
          "15": { min: 7, max: 15 },
          "20": { min: 10, max: 20 }
        };
        const cfg = ranges[size] || ranges["15"];
        
        selectQuantity.innerHTML = '';
        for (let i = cfg.min; i <= cfg.max; i++) {
          const opt = document.createElement('option');
          opt.value = i;
          opt.textContent = i;
          if (i === Math.floor((cfg.min + cfg.max) / 2)) opt.selected = true;
          selectQuantity.appendChild(opt);
        }
      }
      
      selectGridSize.addEventListener('change', updateQuantityOptions);

      selectTheme.addEventListener('change', () => {
        if (selectTheme.value) {
          const themeName = THEMES[selectTheme.value].name;
          document.getElementById('game-title').value = `Caça-Palavras — ${themeName}`;
          document.getElementById('game-subtitle').value = `Encontre as palavras relacionadas ao tema ${themeName}.`;
        }
      });

      document.getElementById('btn-generate').addEventListener('click', () => {
        UI.hideError();
        let wordsList = [];
        const selectedSize = parseInt(document.getElementById('grid-size').value, 10);

        if (currentMode === 'manual') {
          for (let i = 1; i <= 10; i++) {
            const val = document.getElementById(`word-${i}`).value.trim();
            if (val.length > 0) {
              const clean = UI.sanitizeWord(val);
              
              if (clean.length < 3) {
                return UI.showError(`A palavra "${val}" é muito curta. Mínimo de 3 caracteres.`);
              }
              if (clean.length > selectedSize) {
                return UI.showError(`A palavra "${val}" possui ${clean.length} caracteres e não cabe em uma matriz ${selectedSize}x${selectedSize}. Selecione uma matriz maior.`);
              }
              if (wordsList.some(w => w.clean === clean)) {
                return UI.showError(`A palavra "${val}" já foi adicionada. Remova palavras duplicadas.`);
              }
              
              wordsList.push({ display: val.toUpperCase(), clean });
            }
          }
          if (wordsList.length < 3) return UI.showError("Insira pelo menos 3 palavras.");
          
        } else {
          const themeKey = selectTheme.value;
          if (!themeKey) return UI.showError("Selecione um tema válido.");
          
          const themeName = THEMES[themeKey].name;
          document.getElementById('game-title').value = `Caça-Palavras — ${themeName}`;
          document.getElementById('game-subtitle').value = `Encontre as palavras relacionadas ao tema ${themeName}.`;
          
          const qty = parseInt(selectQuantity.value, 10);
          const themeWords = THEMES[themeKey].words.filter(w => UI.sanitizeWord(w).length <= selectedSize);
          
          if (themeWords.length < qty) {
            return UI.showError(`O tema "${THEMES[themeKey].name}" não possui ${qty} palavras que caibam na matriz ${selectedSize}x${selectedSize}. Aumente o quadro ou reduza a quantidade.`);
          }
          
          const shuffled = UI.shuffleArray([...themeWords]);
          const selected = shuffled.slice(0, qty);
          
          wordsList = selected.map(w => ({
            display: w.toUpperCase(),
            clean: UI.sanitizeWord(w)
          }));
        }

        const titleVal = document.getElementById('game-title').value.trim() || "Meu Caça-Palavras";
        const descVal = document.getElementById('game-subtitle').value.trim() || "Encontre as palavras escondidas!";
        document.getElementById('header-title').textContent = titleVal;
        document.getElementById('header-desc').textContent = descVal;

        // Gerar metadados congelados deste momento (utilizado no PDF e rodapés)
        const now = new Date();
        const pad = n => n.toString().padStart(2, '0');
        generationMeta = {
          dateBR: `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`,
          dateISO: `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`,
          host: window.location.hostname || 'localhost'
        };
        const footerText = `Gerado em: ${generationMeta.dateBR} | Origem: ${generationMeta.host}`;
        document.getElementById('footer-watermark').textContent = footerText;

        if (!gameInstance) gameInstance = new WordSearchGame();
        
        try {
          gameInstance.start(wordsList, selectedSize);
          document.getElementById('setup-screen').classList.add('hidden');
          document.getElementById('game-screen').classList.remove('hidden');
        } catch (e) {
          UI.showError(e.message);
        }
      });

      const returnToSetup = () => {
        if(gameInstance) gameInstance.timerMgr.stop();
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('win-modal').classList.remove('active');
        document.getElementById('setup-screen').classList.remove('hidden');
      };

      document.getElementById('btn-edit').addEventListener('click', returnToSetup);
      document.getElementById('btn-new-game-modal').addEventListener('click', returnToSetup);
      document.getElementById('btn-restart').addEventListener('click', () => gameInstance.init());
      document.getElementById('btn-play-again').addEventListener('click', () => gameInstance.init());
      document.getElementById('btn-hint').addEventListener('click', () => gameInstance.giveHint());
      
      const executePrint = (mode) => {
        if (mode === 'answer') {
          document.body.classList.add('print-answer');
          if (gameInstance) gameInstance.drawAllAnswers();
        } else {
          document.body.classList.add('print-normal');
        }
        
        // Um pequeno delay garante que o canvas seja redesenhado e o DOM atualizado 
        // antes de o navegador "congelar" a tela para a janela de impressão.
        setTimeout(() => {
          window.print();
          document.body.classList.remove('print-normal', 'print-answer');
          if (gameInstance) gameInstance.redrawFoundLines(); 
        }, 300);
      };

      document.getElementById('btn-print').addEventListener('click', () => executePrint('normal'));
      document.getElementById('btn-print-answers-inline').addEventListener('click', () => executePrint('answer'));
      document.getElementById('btn-print-answers').addEventListener('click', () => executePrint('answer'));

      const generatePDF = (withAnswerKeyOnly = false) => {
        if (!window.jspdf || !gameInstance) return alert("Erro ao inicializar biblioteca de PDF.");
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        const title = document.getElementById('header-title').textContent;
        const subtitle = document.getElementById('header-desc').textContent;
        const size = gameInstance.gridSize;
        const cellSize = Math.min(10, 150 / size); 
        const gridWidth = size * cellSize;
        const startX = (210 - gridWidth) / 2;

        const addFooter = (currentPage, totalPages) => {
          doc.setFont("helvetica", "normal");
          doc.setFontSize(9);
          doc.setTextColor(100, 116, 139);
          const footerStr = `Gerado em: ${generationMeta.dateBR} | Origem: ${generationMeta.host}`;
          doc.text(footerStr, 105, 290, { align: "center" });
          if (totalPages > 1) {
            doc.text(`Página ${currentPage} de ${totalPages}`, 195, 290, { align: "right" });
          }
        };

        const drawPage = (isAnswerKey, pageNum, totalPages) => {
          let y = 20;
          doc.setFont("helvetica", "bold"); doc.setFontSize(22); doc.setTextColor(124, 45, 18);
          doc.text(isAnswerKey ? title + " - GABARITO" : title, 105, y, { align: "center" });
          
          y += 10;
          doc.setFont("helvetica", "normal"); doc.setFontSize(12); doc.setTextColor(100, 116, 139);
          doc.text(subtitle, 105, y, { align: "center" });
          
          const startY = y + 15;

          if (isAnswerKey) {
            doc.setDrawColor(22, 163, 74); 
            doc.setLineWidth(cellSize * 0.7);
            doc.setLineCap('round');
            gameInstance.placedWords.forEach(pw => {
              const x1 = startX + pw.start.c * cellSize + cellSize / 2;
              const y1 = startY + pw.start.r * cellSize + cellSize / 2;
              const x2 = startX + pw.end.c * cellSize + cellSize / 2;
              const y2 = startY + pw.end.r * cellSize + cellSize / 2;
              doc.line(x1, y1, x2, y2);
            });
          }

          doc.setFont("helvetica", "bold"); doc.setFontSize(cellSize * 0.6);
          for(let r=0; r<size; r++) {
            for(let c=0; c<size; c++) {
              const char = gameInstance.grid[r][c];
              const xPos = startX + c * cellSize + cellSize / 2;
              const yPos = startY + r * cellSize + cellSize / 2;
              doc.setTextColor(0, 0, 0); 
              doc.text(char, xPos, yPos, { align: 'center', baseline: 'middle' });
            }
          }

          if (!isAnswerKey) {
            y = startY + gridWidth + 20;
            doc.setFontSize(14); doc.setTextColor(124, 45, 18);
            doc.text("Palavras para encontrar:", 105, y, { align: "center" });
            
            y += 10; doc.setFontSize(11); doc.setTextColor(0, 0, 0);
            const cols = 3; const colWidth = 180 / cols; let currentX = 15;
            
            gameInstance.placedWords.forEach((pw, idx) => {
              if (idx > 0 && idx % cols === 0) { y += 7; currentX = 15; }
              doc.text(pw.display, currentX, y);
              currentX += colWidth;
            });
          }
          
          addFooter(pageNum, totalPages);
        };

        let filename = "";
        
        if (withAnswerKeyOnly) {
          drawPage(true, 1, 1);
          filename = `caca-palavras-${generationMeta.dateISO}-gabarito.pdf`;
        } else {
          drawPage(false, 1, 2); // Pagina 1
          doc.addPage();
          drawPage(true, 2, 2);  // Pagina 2
          filename = `caca-palavras-${generationMeta.dateISO}.pdf`;
        }
        
        doc.save(filename);
      };

      document.getElementById('btn-pdf').addEventListener('click', () => generatePDF(false));
      document.getElementById('btn-pdf-answers').addEventListener('click', () => generatePDF(true));
    });
  </script>
</body>
